site_name: Teknoloji Rehberleri
site_description: Yazılım, teknoloji ve dijital araçlar hakkında kapsamlı Türkçe rehberler
site_author: Teknoloji Rehberleri Ekibi
theme:
  name: material
  language: tr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Koyu mod
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Açık mod
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - Ana Sayfa: index.md
  - Geliştirme:
    - API Test & Web Geliştirme: docs/API-Test-Web-Geliştirme.md
    - Blockchain & Kripto: docs/Blockchain-Kripto.md
